services:
  db:
    image: postgres:16
    container_name: spreeexpress_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: spreeexpress
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spreeexpress"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
